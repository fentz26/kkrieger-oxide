name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }} / Rust 1.100.0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Linux audio runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2t64 libasound2-data
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --tests --no-fail-fast
      - name: Linux native audio integration
        if: runner.os == 'Linux'
        env:
          KKRIEGER_AUDIO_DEVICE: 'null'
        run: cargo test --locked --test audio_output -- --ignored
      - name: System font integration
        if: runner.os != 'Linux'
        run: cargo test --locked --test font_pages authored_menu_font_packs_real_glyphs_with_windows_line_metrics -- --ignored --exact
      - name: Windows original GDI reference
        if: runner.os == 'Windows'
        run: |
          python tools/verify_gdi_font.py
          cargo test --locked --test gdi_text_reference -- --ignored --exact atlas_metrics_and_pixels_match_published_gdi_routines
      - name: Release build
        run: cargo build --locked --release
      - name: Release size
        run: |
          if [ -f target/release/kkrieger-oxide.exe ]; then
            wc -c target/release/kkrieger-oxide.exe
          else
            wc -c target/release/kkrieger-oxide
          fi
