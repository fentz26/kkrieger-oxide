[package]
name = "kkrieger-oxide"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT AND BSD-2-Clause"
description = "A Rust rewrite of .kkrieger focused on procedural generation, compact binaries, and performance."
default-run = "kkrieger-oxide"

[dependencies]
# Keep mesh transcendental functions independent of the host C math library.
libm = { version = "=0.2.16", default-features = false }
miniquad = "=0.4.11"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.speed]
inherits = "release"
opt-level = 3

[profile.tiny]
inherits = "release"
opt-level = "z"
